[project]
name = "linux-computer-use"
version = "0.1.0"
description = "Unified Linux desktop control layer for AI agents and automation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Dream Pixels Forge", email = "dev@dream-pixels-forge.com"}
]
keywords = ["linux", "desktop", "automation", "mcp", "accessibility", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp>=1.0.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "coverage>=7.0.0",
]
mcp = [
    "mcp>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
]
x11 = [
    "python-xlib>=0.3.2",
    "ewmh>=0.2.0",
]
atspi = [
    "PyGObject>=3.48.0",
]

[project.scripts]
linux-computer-use = "linux_computer_use.cli.main:main"

[project.urls]
Homepage = "https://github.com/dream-pixels-forge/linux-computer-use"
Documentation = "https://github.com/dream-pixels-forge/linux-computer-use#readme"
Repository = "https://github.com/dream-pixels-forge/linux-computer-use.git"
Issues = "https://github.com/dream-pixels-forge/linux-computer-use/issues"

[tool.poetry]
packages = [{include = "linux_computer_use", from = "src/python"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
pytest-cov = "^5.0.0"
ruff = "^0.4.0"
mypy = "^1.10.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4", "DTZ", "DJ", "EM", "FBT",
    "PIE", "PYI", "Q", "SIM", "TID", "TCH", "PTH", "FIX", "PERF", "FUR",
    "RUF"
]
ignore = ["E501", "FBT001", "FBT002", "S101", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
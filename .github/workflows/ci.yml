name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check src/python tests

      - name: Type check
        run: mypy src/python

      - name: Unit tests
        run: pytest tests/unit

  x11-integration:
    name: X11 + AT-SPI integration (Xvfb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install X, AT-SPI and GTK
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xdotool scrot xterm dbus-x11 \
            at-spi2-core libatk-adaptor gir1.2-atspi-2.0 \
            gir1.2-secret-1 gnome-keyring \
            python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 \
            libgirepository-2.0-dev libcairo2-dev pkg-config

      - name: Install
        run: pip install -e ".[dev,atspi]"

      # The GTK demo app runs on the system Python (python3-gi); the server
      # and tests run on setup-python's interpreter with PyGObject from pip.
      - name: Integration tests
        env:
          LCU_GTK_PYTHON: /usr/bin/python3
        run: dbus-run-session -- xvfb-run -a pytest tests/integration -rs

  wayland-integration:
    name: Wayland + AT-SPI integration (Weston)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Weston, AT-SPI, GTK and Qt 6
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            weston dbus at-spi2-core libatk-adaptor gir1.2-atspi-2.0 \
            python3-gi gir1.2-gtk-3.0 gir1.2-gtk-4.0 \
            python3-pyside6 \
            libgirepository-2.0-dev libcairo2-dev pkg-config

      - name: Install
        run: pip install -e ".[dev,atspi]"

      - name: Integration tests
        env:
          LCU_GTK_PYTHON: /usr/bin/python3
        run: tests/integration/run_wayland.sh -rs

  gnome-live:
    name: Real GNOME portal (headless GNOME Shell)
    runs-on: ubuntu-24.04
    # A plain container, so the test script can run its own system bus and a
    # mock logind for GNOME Shell (see tests/integration/run_gnome.sh).
    container:
      image: ubuntu:24.04
    timeout-minutes: 20
    steps:
      - name: Install GNOME Shell, the portals and GTK
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git ca-certificates python3 python3-venv python3-gi python3-dbusmock \
            gnome-shell mutter xdg-desktop-portal xdg-desktop-portal-gnome \
            pipewire wireplumber dbus dbus-user-session libglib2.0-bin \
            at-spi2-core gir1.2-atspi-2.0 gir1.2-gtk-4.0

      - uses: actions/checkout@v5

      - name: Install
        run: |
          python3 -m venv --system-site-packages /opt/venv
          /opt/venv/bin/pip install -e ".[dev,atspi]"

      - name: GNOME portal tests
        env:
          PYTHON: /opt/venv/bin/python
          LCU_GTK_PYTHON: /usr/bin/python3
          LCU_GNOME_LOGS: /tmp/gnome-logs
        run: tests/integration/run_gnome.sh -v -rs

      - name: Keep the GNOME logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gnome-logs
          path: /tmp/gnome-logs

  types:
    name: TypeScript types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

  build:
    needs: [python, x11-integration, wayland-integration, types]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Build Python package
        run: |
          pip install build
          python -m build

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: pnpm

      - name: Build TypeScript types
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The builds above are the real check; a full artifact storage quota
      # shouldn't fail CI.
      - uses: actions/upload-artifact@v5
        continue-on-error: true
        with:
          name: dist
          path: dist/
          retention-days: 7
